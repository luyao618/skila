name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the floor, not plain 20: vitest 4's rolldown binding declares
        # `engines: ^20.19.0 || >=22.12.0`, so on older 20.x npm silently skips
        # the native binding and the suite dies at startup.
        node: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` is the merge gate for lockfile integrity: it fails outright if
      # package.json and package-lock.json have drifted apart.
      - name: Install (clean, from lockfile)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # dist/ is committed (the plugin marketplace installs from this repo), so
      # a rebuild must reproduce it exactly. This catches the failure mode where
      # source changes land without the regenerated artifact — which previously
      # shipped a stale dist/ for a whole release — and, since the CSP hashes are
      # derived from dist/web/index.html, it also catches CSP/artifact drift.
      - name: Check committed dist/ matches a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale — run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi
          echo "dist/ is reproducible"

      - name: Test
        run: npm test

      - name: Pack smoke check
        run: npm run pack:check

  browser-gate:
    name: XSS/CSP browser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The gate loads the built artifact, so it must exist first.
      - name: Build
        run: npm run build

      # Drives the real UI in Chromium against the real server: proves the
      # sha256 CSP authorises the app to boot, that both innerHTML sinks strip
      # hostile markup as they run in production, that no payload executes, and
      # that a missing manifest fails closed. SKILA_BROWSER_GATE=1 makes the
      # suite hard-fail instead of skipping when Chromium is unavailable.
      - name: Run XSS/CSP browser gate
        env:
          SKILA_BROWSER_GATE: '1'
        run: npx vitest run tests/web/test_phase1_browser_gate.ts

  audit:
    name: production audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Blocking: anything shipped to users must be advisory-clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      # Needed by audit:vendor below, which reads package-lock + the committed
      # dist/ artifacts. The audits above query the registry and need no install.
      - name: Install (clean, from lockfile)
        run: npm ci --ignore-scripts

      # Non-blocking: dev/build-path advisories are visible but must not wedge
      # the merge gate on an upstream fix we do not control.
      - name: Audit all dependencies (report only)
        run: npm audit || true

      # `npm audit --omit=dev` structurally cannot see packages that esbuild
      # bundles into dist/web/vendor/* — they are devDependencies that ship
      # inside the tarball. This surfaces their advisories explicitly so
      # shipped vendor code is tracked rather than silently exempt.
      - name: Audit bundled vendor code (report only)
        run: npm run audit:vendor
